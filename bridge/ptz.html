<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Câmera</title>
  <style>
    html, body { height: 100%; margin: 0; background: #000; overflow: hidden; }
    video-stream { position: absolute; inset: 0; }
    .pad {
      position: absolute; right: 12px; bottom: 12px;
      display: grid; grid-template: repeat(3, 44px) / repeat(3, 44px); gap: 4px;
      opacity: .55; transition: opacity .2s;
    }
    .pad:hover, .pad:focus-within, .pad.active { opacity: 1; }
    .pad button {
      border: 0; border-radius: 50%; background: rgb(0 0 0 / .55); color: #fff;
      font: 18px/1 system-ui, sans-serif; cursor: pointer; touch-action: none; user-select: none;
      -webkit-user-select: none; -webkit-touch-callout: none;
    }
    .pad button:active, .pad button.held { background: rgb(255 255 255 / .35); }
    .pad .up { grid-area: 1 / 2; } .pad .left { grid-area: 2 / 1; }
    .pad .right { grid-area: 2 / 3; } .pad .down { grid-area: 3 / 2; }
    .error { position: absolute; left: 12px; bottom: 12px; color: #fff; font: 13px system-ui, sans-serif;
      background: rgb(180 30 30 / .8); padding: 6px 10px; border-radius: 6px; display: none; }
  </style>
</head>
<body>
  <div class="pad" aria-label="Mover câmera">
    <button class="up" data-x="0" data-y="1" aria-label="Para cima">▲</button>
    <button class="left" data-x="-1" data-y="0" aria-label="Para a esquerda">◀</button>
    <button class="right" data-x="1" data-y="0" aria-label="Para a direita">▶</button>
    <button class="down" data-x="0" data-y="-1" aria-label="Para baixo">▼</button>
  </div>
  <div class="error" role="status"></div>

  <script type="module" src="/video-stream.js"></script>
  <script type="module">
    const src = new URLSearchParams(location.search).get('src') ?? ''
    const video = document.createElement('video-stream')
    video.background = true
    video.src = new URL('/api/ws?src=' + encodeURIComponent(src), location.href)
    document.body.prepend(video)

    const pad = document.querySelector('.pad')
    const error = document.querySelector('.error')
    let timer = null

    function post(action, body) {
      return fetch(`/ptz/${action}?src=${encodeURIComponent(src)}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body ?? {}),
      }).then((res) => {
        error.style.display = res.ok ? 'none' : 'block'
        error.textContent = res.ok ? '' : 'A câmera não respondeu ao movimento'
      }, () => {
        error.style.display = 'block'
        error.textContent = 'Sem conexão com a ponte'
      })
    }

    // The server stops a move after 1s on its own, so it is renewed while the button is held.
    function start(x, y) {
      stop(false)
      pad.classList.add('active')
      post('move', { x, y })
      timer = setInterval(() => post('move', { x, y }), 500)
    }

    function stop(send = true) {
      if (timer === null) return
      clearInterval(timer)
      timer = null
      pad.classList.remove('active')
      pad.querySelectorAll('.held').forEach((b) => b.classList.remove('held'))
      if (send) post('stop')
    }

    for (const button of pad.querySelectorAll('button')) {
      button.addEventListener('pointerdown', (e) => {
        e.preventDefault()
        button.setPointerCapture(e.pointerId)
        start(Number(button.dataset.x), Number(button.dataset.y))
        button.classList.add('held')
      })
      button.addEventListener('pointerup', () => stop())
      button.addEventListener('pointercancel', () => stop())
      button.addEventListener('contextmenu', (e) => e.preventDefault())
    }

    const KEYS = { ArrowUp: [0, 1], ArrowDown: [0, -1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] }
    let key = null
    addEventListener('keydown', (e) => {
      if (!KEYS[e.key] || e.repeat) return
      e.preventDefault()
      key = e.key
      start(...KEYS[e.key])
    })
    addEventListener('keyup', (e) => e.key === key && ((key = null), stop()))
    addEventListener('blur', () => stop())
    document.addEventListener('visibilitychange', () => document.hidden && stop())
  </script>
</body>
</html>
