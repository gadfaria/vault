# Copy to go2rtc.yaml (git-ignored) and fill in the camera's IP and password.

api:
  # Only cloudflared, on this same machine, reaches the API and the player.
  listen: "127.0.0.1:1984"
  # Static pages and the player socket only: the rest of the API shows the camera password and can rewrite this file.
  allow_paths: [/, /api/ws]

rtsp:
  # go2rtc's own RTSP server has no auth: keep it off.
  listen: ""

webrtc:
  # Direct WebRTC on the home network; through the tunnel the player falls back to MSE.
  listen: ":8555"

streams:
  # Intelbras Mibo (Dahua-based), H.264 + AAC. The password is the one set in the Mibo app.
  living-room: rtsp://admin:CAMERA_PASSWORD@192.168.1.3:554/cam/realmonitor?channel=1&subtype=0
  # 640×480, for slow connections
  living-room-sd: rtsp://admin:CAMERA_PASSWORD@192.168.1.3:554/cam/realmonitor?channel=1&subtype=1
